[project]
name = "local-inbox-assistant"
version = "0.1.0"
description = "Local AI-assisted inbox: Thunderbird maildir + Ollama RAG + MCP"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.139.2",
    "uvicorn>=0.34",
    "chromadb>=1.0",
    "httpx>=0.28",
    "pydantic-settings>=2.8",
    "mcp>=1.9",
    "beautifulsoup4>=4.13",
    "markdownify>=1.2.3",
    "anthropic>=0.120.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.16.0",
]

[tool.ruff.lint]
# Selected explicitly rather than inheriting ruff's defaults: 0.16 grew the
# default set from 59 rules to 413, which changed what CI enforced without a
# change to this repo. Pinning the set means a ruff upgrade is a dependency
# bump, not a silent policy change.
#
# E4/E7/E9 + F are ruff's pre-0.16 defaults (pycodestyle essentials, pyflakes).
# I and UP are added deliberately: import sorting and modern-syntax rewrites
# are mechanical and entirely auto-fixable.
#
# Not selected, on purpose: BLE001 and S110 flag the broad `except Exception`
# and try/except/pass in the parser and indexer, which are the deliberate
# per-email fault tolerance this project is built around and tests for.
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
