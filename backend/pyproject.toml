[project]
name = "local-inbox-assistant"
version = "0.1.0"
description = "Local AI-assisted inbox: Thunderbird maildir + Ollama RAG + MCP"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "chromadb>=1.0",
    "httpx>=0.28",
    "pydantic-settings>=2.8",
    "mcp>=1.9",
    "beautifulsoup4>=4.13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
